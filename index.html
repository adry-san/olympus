
<!DOCTYPE html>
<html lang="fr">
<head>
  <link rel="icon" type="image/png" href="flavicon.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome on Olympus</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --gold: #dfc58b;
  --white: #f2f3fa;
  --muted: #a1a9c1;
}

body {
  min-height: 100vh;
  overflow-x: hidden;
  font-family: "Segoe UI", Arial, sans-serif;
  color: var(--white);
  background: #030611;
}

/* SPACE BACKGROUND */

.space {
  position: fixed;
  inset: 0;
  z-index: -2;
  background:
    linear-gradient(
      180deg,
      rgba(3, 6, 17, .25),
      rgba(3, 6, 17, .55) 55%,
      #030611 100%
    ),
    url("images/simple-space-backgrounds-3840x2160-galaxy-night-sky-26295.jpg")
    center center / cover no-repeat;
  transform: scale(1.02);
}

.space::after {
  content: "";
  position: absolute;
  inset: 0;
  background: radial-gradient(
    ellipse at 50% 42%,
    transparent 0%,
    rgba(3, 6, 17, .15) 40%,
    rgba(3, 6, 17, .75) 100%
  );
}

/* SUBTLE STARS */

.stars {
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  opacity: .4;
  background-image:
    radial-gradient(1px 1px at 10% 20%, white 99%, transparent),
    radial-gradient(2px 2px at 80% 15%, white 99%, transparent),
    radial-gradient(1px 1px at 30% 65%, white 99%, transparent),
    radial-gradient(1px 1px at 70% 80%, white 99%, transparent),
    radial-gradient(2px 2px at 55% 35%, white 99%, transparent),
    radial-gradient(1px 1px at 90% 55%, white 99%, transparent);
  background-size: 280px 240px;
}

main {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 60px 24px 40px;
}

/* HEADER */

.header {
  text-align: center;
  margin-bottom: 65px;
}

.kicker {
  color: var(--gold);
  text-transform: uppercase;
  font-size: .68rem;
  letter-spacing: 6px;
  margin-bottom: 22px;
}

h1 {
  font-family: Georgia, "Times New Roman", serif;
  font-size: clamp(3.2rem, 7vw, 5.8rem);
  font-weight: 400;
  letter-spacing: 7px;
  line-height: 1.1;
  text-shadow: 0 4px 35px #0009;
}

.subtitle {
  margin-top: 20px;
  font-size: .9rem;
  letter-spacing: 1px;
  color: #c0c5d7;
  font-weight: 300;
}

/* PLANETS */

.planet-menu {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: clamp(70px, 15vw, 220px);
  width: 100%;
}

.planet-link {
  width: 230px;
  display: flex;
  align-items: center;
  justify-content: center;
  text-decoration: none;
  outline: none;
}

.planet {
  width: clamp(150px, 19vw, 225px);
  aspect-ratio: 1;
  position: relative;
  isolation: isolate;
  border-radius: 50%;
  overflow: hidden;
  background: #18243d;
  transition:
    transform .55s ease,
    filter .55s ease;
  animation: drift 7s ease-in-out infinite;
}

.planet img {
  position: absolute;
  inset: 0;
  z-index: 0;
  width: 150%;
  height: 150%;
  display: block;
  border-radius: 50%;
  object-fit: cover;
}

/* Ombre sphérique au-dessus de la texture */
.planet::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 1;
  border-radius: 50%;
  pointer-events: none;
  background: radial-gradient(
    circle at 30% 25%,
    transparent 0%,
    rgba(0, 0, 0, .08) 40%,
    rgba(0, 0, 0, .85) 100%
  );
  box-shadow:
    inset 5px 5px 18px rgba(255,255,255,.15),
    inset -12px -8px 25px rgba(0,0,0,.55);
}

/* Soft outer glow */

.planet::after {
  content: "";
  position: absolute;
  inset: -23px;
  z-index: -2;
  border-radius: 50%;
  background: radial-gradient(
    circle,
    rgba(110,146,255,.20),
    rgba(74,91,179,.06) 48%,
    transparent 72%
  );
  opacity: .45;
  transition: opacity .5s ease;
}

.planet-link:hover .planet,
.planet-link:focus-visible .planet {
  transform: scale(1.12);
  filter: brightness(1.12);
}

.planet-link:hover .planet::before,
.planet-link:focus-visible .planet::before {
  box-shadow:
    inset 8px 6px 18px rgba(255,255,255,.22),
    inset -15px -8px 30px rgba(0,0,0,.7),
    0 0 45px rgba(120,154,255,.2);
}

.planet-link:hover .planet::after,
.planet-link:focus-visible .planet::after {
  opacity: 1;
}

.planet-link:nth-child(2) .planet {
  animation-delay: -3.5s;
}

/* INFORMATION PANEL */
/* One fixed position for every planet */

.info-panel {
  margin-top: 58px;
  width: min(540px, 90vw);
  min-height: 145px;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
}

.info-name {
  color: var(--gold);
  font-family: Georgia, "Times New Roman", serif;
  font-size: clamp(1.5rem, 3vw, 2rem);
  font-weight: 400;
  letter-spacing: 3px;
  text-transform: uppercase;
  opacity: 0;
  transform: translateY(8px);
  transition:
    opacity .3s ease,
    transform .3s ease;
}

.info-description {
  margin-top: 13px;
  color: #c0c7d9;
  font-size: .9rem;
  line-height: 1.8;
  font-weight: 300;
  max-width: 440px;
  opacity: 0;
  transform: translateY(8px);
  transition:
    opacity .3s ease .04s,
    transform .3s ease .04s;
}

.info-panel.active .info-name,
.info-panel.active .info-description {
  opacity: 1;
  transform: translateY(0);
}

.info-line {
  width: 42px;
  height: 1px;
  background: var(--gold);
  margin-top: 18px;
  opacity: 0;
  transition: opacity .3s ease;
}

.info-panel.active .info-line {
  opacity: .75;
}

.footer {
  margin-top: 25px;
  font-size: .63rem;
  letter-spacing: 4px;
  text-transform: uppercase;
  color: #747e9b;
}

@keyframes drift {
  0%, 100% { translate: 0 0; }
  50% { translate: 0 -9px; }
}

@media (max-width: 600px) {
  main {
    padding-top: 60px;
    justify-content: flex-start;
  }

  .header {
    margin-bottom: 60px;
  }

  .planet-menu {
    gap: 45px;
  }

  .planet-link {
    width: 40%;
  }

  .planet {
    width: 100%;
    max-width: 165px;
  }

  .info-panel {
    margin-top: 50px;
    min-height: 160px;
  }

  .info-name {
    font-size: 1.3rem;
  }

  .info-description {
    font-size: .82rem;
  }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation: none !important;
    transition: none !important;
  }
}
</style>
</head>

<body>
<div class="space"></div>
<div class="stars"></div>

<main>
  <header class="header">
    <p class="kicker">A gateway beyond the stars</p>
    <h1>OLYMPUS</h1>
    <p class="subtitle">
      Your universe. Your tools. Your destination.
    </p>
  </header>

  <nav class="planet-menu" aria-label="Applications">

    <a
      class="planet-link"
      href="diana.html"
      data-name="Diana"
      data-description="Assign a target to every player, creating a perfect single loop"
    >
      <div class="planet">
        <img
          src="images/dione_img.png"
          alt=""
        >
      </div>
    </a>

    
    <a
      class="planet-link"
      href="mars.html"
      data-name="Mars"
      data-description="Sort through albums, and crown your favourite photos"
      aria-label="Blanc Manger bacchus — multiplayer card game"
    >
      <div class="planet">
        <img
          src="images/mars_img.png"
          alt=""
        >
      </div>
    </a>

    
    <a
      class="planet-link"
      href="bacchus.html"
      data-name="Bacchus"
      data-description="Entertain every player with a card game where creativity, unexpected answers and humour collide."
      aria-label="Blanc Manger bacchus — multiplayer card game"
    >
      <div class="planet">
        <img
          src="images/europa_img.png"
          alt=""
        >
      </div>
    </a>

  </nav>

  <!-- Shared information area -->

  <section
    class="info-panel"
    id="infoPanel"
    aria-live="polite"
    aria-atomic="true"
  >
    <h2 class="info-name" id="infoName"></h2>
    <p class="info-description" id="infoDescription"></p>
    <div class="info-line"></div>
  </section>

  <footer class="footer">
    Adrien's personal ragbag
  </footer>
</main>

<script>
const planets = document.querySelectorAll(".planet-link");
const panel = document.getElementById("infoPanel");
const nameElement = document.getElementById("infoName");
const descriptionElement =
  document.getElementById("infoDescription");

function showInfo(planet) {
  nameElement.textContent = planet.dataset.name;
  descriptionElement.textContent =
    planet.dataset.description;

  panel.classList.add("active");
}

function hideInfo() {
  panel.classList.remove("active");
}

planets.forEach((planet) => {
  planet.addEventListener("mouseenter", () => {
    showInfo(planet);
  });

  planet.addEventListener("mouseleave", hideInfo);

  planet.addEventListener("focus", () => {
    showInfo(planet);
  });

  planet.addEventListener("blur", hideInfo);
});
</script>
</body>
</html>
