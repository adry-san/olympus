<!DOCTYPE html>
<html lang="fr">
<head>
  <link rel="icon" type="image/png" href="flavicon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vote Photos — CAMP 2026</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #1a1a2e; color: white; min-height: 100vh; }

    /* HEADER */
    .header { position: sticky; top: 0; z-index: 50; background: #16213e; border-bottom: 1px solid #333; padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
    .header h1 { font-size: 1.1rem; color: #e2b96f; }
    .header-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .stat-chip { background: #0f3460; border-radius: 20px; padding: 5px 12px; font-size: 0.8rem; color: #4ecca3; }
    .btn-top { padding: 7px 14px; border-radius: 8px; border: none; font-size: 0.85rem; cursor: pointer; font-weight: bold; }
    .btn-results { background: #e2b96f; color: #1a1a2e; }
    .btn-back { background: #333; color: white; text-decoration: none; display: inline-flex; align-items: center; }

    /* ÉCRANS */
    .screen { display: none; }
    .screen.active { display: block; }

    /* ÉCRAN LOGIN */
    #screen-login { max-width: 400px; margin: 60px auto; padding: 30px 20px; text-align: center; }
    #screen-login h2 { color: #e2b96f; margin-bottom: 8px; }
    #screen-login p { color: #aaa; font-size: 0.9rem; margin-bottom: 24px; }
    #screen-login input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #333; font-size: 1rem; margin-bottom: 12px; background: #16213e; color: white; }
    #screen-login button { width: 100%; padding: 14px; border-radius: 10px; border: none; font-size: 1rem; cursor: pointer; font-weight: bold; background: #e2b96f; color: #1a1a2e; }

    /* LOADING */
    #screen-loading { text-align: center; padding: 80px 20px; }
    .spinner { width: 48px; height: 48px; border: 4px solid #333; border-top-color: #4ecca3; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 20px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* GRILLE PHOTOS */
    #screen-vote { padding: 16px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
    @media(max-width:500px) { .grid { grid-template-columns: repeat(2, 1fr); gap: 6px; } }

    .photo-card { position: relative; border-radius: 10px; overflow: hidden; cursor: pointer; aspect-ratio: 1; background: #16213e; border: 2px solid transparent; transition: border-color 0.2s, transform 0.15s; }
    .photo-card:hover { transform: scale(1.02); }
    .photo-card.voted { border-color: #e2b96f; }
    .photo-card img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .photo-card .overlay { position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(transparent, rgba(0,0,0,0.7)); padding: 20px 8px 6px; display: flex; align-items: center; justify-content: space-between; }
    .photo-card .vote-count { font-size: 0.85rem; font-weight: bold; color: white; }
    .photo-card .vote-icon { font-size: 1.1rem; transition: transform 0.2s; }
    .photo-card.voted .vote-icon { transform: scale(1.3); }
    .photo-card .voted-badge { position: absolute; top: 6px; right: 6px; background: #e2b96f; color: #1a1a2e; border-radius: 50%; width: 22px; height: 22px; font-size: 0.7rem; display: flex; align-items: center; justify-content: center; font-weight: bold; }

    /* RÉSULTATS */
    #screen-results { padding: 16px; }
    #screen-results h2 { color: #e2b96f; margin-bottom: 16px; text-align: center; }
    .results-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
    .result-card { position: relative; border-radius: 10px; overflow: hidden; aspect-ratio: 1; background: #16213e; border: 2px solid #e2b96f; }
    .result-card img { width: 100%; height: 100%; object-fit: cover; }
    .result-card .rank-badge { position: absolute; top: 6px; left: 6px; background: #e2b96f; color: #1a1a2e; border-radius: 6px; padding: 2px 8px; font-size: 0.8rem; font-weight: bold; }
    .result-card .count-badge { position: absolute; bottom: 6px; right: 6px; background: rgba(0,0,0,0.7); color: white; border-radius: 6px; padding: 2px 8px; font-size: 0.8rem; }

    /* LIGHTBOX */
    .lightbox { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.92); z-index: 200; display: none; align-items: center; justify-content: center; flex-direction: column; padding: 20px; }
    .lightbox.open { display: flex; }
    .lightbox img { max-width: 100%; max-height: 80vh; border-radius: 10px; object-fit: contain; }
    .lightbox-actions { display: flex; gap: 12px; margin-top: 16px; }
    .lb-vote-btn { padding: 12px 28px; border-radius: 10px; border: none; font-size: 1rem; cursor: pointer; font-weight: bold; transition: 0.2s; }
    .lb-vote-btn.vote { background: #e2b96f; color: #1a1a2e; }
    .lb-vote-btn.unvote { background: #e94560; color: white; }
    .lb-close { position: absolute; top: 16px; right: 16px; background: none; border: none; color: white; font-size: 1.8rem; cursor: pointer; }
    .lb-count { color: #aaa; font-size: 0.9rem; margin-top: 8px; }

    /* FILTRE */
    .filter-bar { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; align-items: center; }
    .filter-btn { padding: 6px 14px; border-radius: 20px; border: 1px solid #444; background: #16213e; color: #aaa; cursor: pointer; font-size: 0.85rem; }
    .filter-btn.active { background: #e2b96f; color: #1a1a2e; border-color: #e2b96f; font-weight: bold; }
    .search-input { padding: 7px 12px; border-radius: 20px; border: 1px solid #333; background: #16213e; color: white; font-size: 0.85rem; width: 160px; }
  
    /* TAG SUPPRIMER */
    .photo-card.delete-tagged { border-color: #e94560; }
    .photo-card .delete-badge { position: absolute; top: 6px; left: 6px; background: #e94560; color: white; border-radius: 50%; width: 22px; height: 22px; font-size: 0.75rem; display: flex; align-items: center; justify-content: center; font-weight: bold; }
    .delete-count { font-size: 0.75rem; color: #e94560; }
    .lb-delete-btn { padding: 12px 28px; border-radius: 10px; border: none; font-size: 1rem; cursor: pointer; font-weight: bold; transition: 0.2s; }
    .lb-delete-btn.tag { background: #e94560; color: white; }
    .lb-delete-btn.untag { background: #555; color: white; }  
  
  </style>
</head>
<body>

<!-- HEADER -->
<div class="header" id="main-header" style="display:none;">
  <div style="display:flex;align-items:center;gap:12px;">
    <a href="index.html" class="btn-top btn-back">← Accueil</a>
    <h1>📸 CAMP 2026</h1>
  </div>
  <div class="header-right">
    <span class="stat-chip" id="stat-voted">Mes votes : 0</span>
    <span class="stat-chip" id="stat-total">Photos : —</span>
    <span class="stat-chip" id="stat-voters">Votants : —</span>
    <button class="btn-top btn-results" onclick="showResults('top')">🏆 Top 100</button>
<button class="btn-top" style="background:#e94560;color:white;" onclick="showResults('delete')">🗑️ À supprimer</button>
  </div>
</div>

<!-- LOGIN -->
<div id="screen-login" class="screen active">
  <h2>📸 Vote CAMP 2026</h2>
  <p>Entre ton prénom pour commencer à voter</p>
  <input type="text" id="input-voter-name" placeholder="Ton prénom..." maxlength="20"/>
  <button onclick="startVoting()">Commencer →</button>
</div>

<!-- LOADING -->
<div id="screen-loading" class="screen">
  <div class="spinner"></div>
  <p style="color:#aaa;">Chargement des photos...</p>
  <p style="color:#555;font-size:0.8rem;margin-top:8px;" id="loading-progress"></p>
</div>

<!-- VOTE -->
<div id="screen-vote" class="screen">
  <div class="filter-bar">
    <button class="filter-btn active" onclick="setFilter('all', this)">Toutes</button>
    <button class="filter-btn" onclick="setFilter('voted', this)">Mes votes ❤️</button>
    <button class="filter-btn" onclick="setFilter('popular', this)">Les + votées</button>
    <button class="filter-btn" onclick="setFilter('unvoted', this)">Non votées</button>
  </div>
  <div class="grid" id="photo-grid"></div>
</div>

<!-- RÉSULTATS -->
<div id="screen-results" class="screen">
  <h2>🏆 Top 100 des photos</h2>
  <p style="color:#aaa;text-align:center;margin-bottom:20px;font-size:0.9rem;" id="results-subtitle"></p>
  <div class="results-grid" id="results-grid"></div>
  <div style="text-align:center;margin-top:20px;">
    <button class="btn-top btn-results" onclick="showVote()" style="padding:12px 24px;">← Retour au vote</button>
  </div>
</div>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox">
  <button class="lb-close" onclick="closeLightbox()">✕</button>
  <img id="lb-img" src="" alt=""/>
  <div class="lb-count" id="lb-count"></div>
  <div class="lightbox-actions">
  <button class="lb-vote-btn" id="lb-vote-btn" onclick="toggleVoteLightbox()">❤️ Voter</button>
  <button class="lb-delete-btn" id="lb-delete-btn" onclick="toggleDeleteLightbox()">🗑️ À supprimer</button>
</div>
<div class="lb-count" id="lb-delete-count" style="color:#e94560;"></div>
</div>

<script>
// ═══ FIREBASE ════════════════════════════════════
const firebaseConfig = {
  apiKey: "AIzaSyDlXhhS8Az04Z-55LHtJWqrVJt79LhSIAU",
  authDomain: "plateforme-77efd.firebaseapp.com",
  projectId: "plateforme-77efd",
  storageBucket: "plateforme-77efd.firebasestorage.app",
  messagingSenderId: "1061460763647",
  appId: "1:1061460763647:web:8b4ac092a21406cc49bdca"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// ═══ CONFIG ══════════════════════════════════════
const JSON_FILE_ID = '13cZ1-4ZkBwzWHEJ1Dj1JieWBC_tUez9D';
const TOP_N = 100;

// ═══ STATE ═══════════════════════════════════════
let voterName = '';
let voterId = '';
let allPhotos = [];       // [{id, name, url, thumb}]
let votes = {};           // { photoId: count }
let myVotes = new Set();
let myDeletes = new Set();  // set des photoIds tagués à supprimer
let deleteCounts = {};      // { photoId: count }
let currentFilter = 'all';
let lightboxPhotoId = null;
let unsubVotes = null;

// ═══ UTILS ═══════════════════════════════════════
function $(id){ return document.getElementById(id); }
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  $(id).classList.add('active');
}
function genId(){ return Math.random().toString(36).substring(2,12); }

// ═══ LOGIN ═══════════════════════════════════════
// Persistance du voter
function saveVoter(){ localStorage.setItem('camp_voter', JSON.stringify({voterName, voterId})); }
function loadVoter(){ try{ return JSON.parse(localStorage.getItem('camp_voter')); }catch{ return null; } }

window.startVoting = async () => {
  const name = $('input-voter-name').value.trim();
  if(!name) return alert("Entre ton prénom !");
  voterName = name;
  voterId = genId();
  saveVoter();
  await loadEverything();
};

// ═══ CHARGEMENT ══════════════════════════════════
async function loadEverything(){
  showScreen('screen-loading');
  $('main-header').style.display='flex';

  // 1. Charge les photos depuis Google Drive JSON
  try {
    $('loading-progress').textContent = 'Chargement de la liste des photos...';
    const res = await fetch(`https://drive.google.com/uc?export=view&id=${JSON_FILE_ID}`);
    const data = await res.json();
    allPhotos = data.photos || [];
    $('loading-progress').textContent = `${allPhotos.length} photos trouvées. Chargement des votes...`;
  } catch(e) {
    alert("Impossible de charger les photos. Vérifie que le fichier JSON est bien partagé publiquement.");
    showScreen('screen-login');
    return;
  }

  // 2. Enregistre le votant dans Firebase
  await db.collection('camp_voters').doc(voterId).set({
    name: voterName,
    joinedAt: new Date()
  }, {merge: true});

  // 3. Charge les votes existants de ce votant
  const myVoteDoc = await db.collection('camp_votes').doc(voterId).get();
if(myVoteDoc.exists){
  const data = myVoteDoc.data();
  myVotes = new Set(data.voted || []);
  myDeletes = new Set(data.deleted || []);
}

  // 4. Écoute les compteurs de votes en temps réel
  listenVoteCounts();

  $('stat-total').textContent = `Photos : ${allPhotos.length}`;
}

// ═══ VOTES TEMPS RÉEL ════════════════════════════
let unsubDeletes = null;

function listenVoteCounts(){
  if(unsubVotes) unsubVotes();
  if(unsubDeletes) unsubDeletes();

  unsubVotes = db.collection('camp_vote_counts').doc('counts').onSnapshot(doc => {
    votes = doc.exists ? (doc.data() || {}) : {};
    updateStats();
    renderGrid();
    showScreen('screen-vote');
    db.collection('camp_voters').get().then(snap => {
      $('stat-voters').textContent = `Votants : ${snap.size}`;
    });
  });

  unsubDeletes = db.collection('camp_delete_counts').doc('counts').onSnapshot(doc => {
    deleteCounts = doc.exists ? (doc.data() || {}) : {};
    renderGrid();
  });
}

function updateStats(){
  $('stat-voted').textContent = `Mes votes : ${myVotes.size}`;
}

// ═══ VOTE ════════════════════════════════════════
async function toggleVote(photoId){
  const wasVoted = myVotes.has(photoId);
  const delta = wasVoted ? -1 : 1;

  // Optimistic UI
  if(wasVoted) myVotes.delete(photoId);
  else myVotes.add(photoId);

  votes[photoId] = Math.max(0, (votes[photoId] || 0) + delta);
  updateStats();
  updateCard(photoId);
  updateLightboxBtn(photoId);

  // Firebase
  const batch = db.batch();

  // Met à jour mes votes
  batch.set(db.collection('camp_votes').doc(voterId), {
    name: voterName,
    voted: Array.from(myVotes),
    updatedAt: new Date()
  });

  // Met à jour le compteur global
  const countRef = db.collection('camp_vote_counts').doc('counts');
  batch.set(countRef, {
    [photoId]: firebase.firestore.FieldValue.increment(delta)
  }, {merge: true});

  await batch.commit();
}

async function toggleDelete(photoId){
  const wasTagged = myDeletes.has(photoId);
  const delta = wasTagged ? -1 : 1;

  if(wasTagged) myDeletes.delete(photoId);
  else myDeletes.add(photoId);

  deleteCounts[photoId] = Math.max(0, (deleteCounts[photoId] || 0) + delta);
  updateCard(photoId);
  updateLightboxDeleteBtn(photoId);

  const batch = db.batch();
  batch.set(db.collection('camp_votes').doc(voterId), {
    name: voterName,
    voted: Array.from(myVotes),
    deleted: Array.from(myDeletes),
    updatedAt: new Date()
  });
  batch.set(db.collection('camp_delete_counts').doc('counts'), {
    [photoId]: firebase.firestore.FieldValue.increment(delta)
  }, {merge: true});

  await batch.commit();
}

window.toggleDeleteLightbox = () => {
  if(lightboxPhotoId) toggleDelete(lightboxPhotoId);
};
  
// ═══ RENDU GRILLE ════════════════════════════════
function getFilteredPhotos(){
  let list = [...allPhotos];
  if(currentFilter === 'voted') list = list.filter(p => myVotes.has(p.id));
  else if(currentFilter === 'unvoted') list = list.filter(p => !myVotes.has(p.id));
  else if(currentFilter === 'popular') list = list.sort((a,b) => (votes[b.id]||0) - (votes[a.id]||0));
  return list;
}

function renderGrid(){
  const grid = $('photo-grid');
  const filtered = getFilteredPhotos();

  // Mise à jour intelligente : ne recrée pas les cartes existantes
  const existing = new Set([...grid.querySelectorAll('.photo-card')].map(c=>c.dataset.id));
  const needed = new Set(filtered.map(p=>p.id));

  // Supprime les cartes qui ne devraient plus être là
  grid.querySelectorAll('.photo-card').forEach(card => {
    if(!needed.has(card.dataset.id)) card.remove();
  });

  // Ajoute / réordonne
  filtered.forEach((photo, idx) => {
    let card = grid.querySelector(`[data-id="${photo.id}"]`);
    if(!card){
      card = createCard(photo);
      grid.appendChild(card);
    } else {
      updateCard(photo.id);
    }
  });
}

function createCard(photo){
  const voted = myVotes.has(photo.id);
  const count = votes[photo.id] || 0;
  const div = document.createElement('div');
  div.className = `photo-card ${voted?'voted':''}`;
  div.dataset.id = photo.id;
  const deleted = myDeletes.has(photo.id);
const delCount = deleteCounts[photo.id] || 0;
div.innerHTML = `
  <img src="${photo.thumb}" alt="${photo.name}" loading="lazy" onerror="this.src='${photo.url}'"/>
  <div class="overlay">
    <span class="vote-count">❤️ ${count} ${delCount>0?`<span class="delete-count">· 🗑️ ${delCount}</span>`:''}</span>
    <span class="vote-icon">${voted?'💛':'🤍'}</span>
  </div>
  ${voted?'<div class="voted-badge">✓</div>':''}
  ${deleted?'<div class="delete-badge">🗑️</div>':''}`;
  div.addEventListener('click', () => openLightbox(photo.id));
  return div;
}

function updateCard(photoId){
  const card = document.querySelector(`[data-id="${photoId}"]`);
  if(!card) return;
  const voted = myVotes.has(photoId);
  const deleted = myDeletes.has(photoId);
  const count = votes[photoId] || 0;
  const delCount = deleteCounts[photoId] || 0;

  card.classList.toggle('voted', voted);
  card.classList.toggle('delete-tagged', deleted);

  const countEl = card.querySelector('.vote-count');
  const iconEl = card.querySelector('.vote-icon');
  const badgeEl = card.querySelector('.voted-badge');
  const delBadgeEl = card.querySelector('.delete-badge');

  if(countEl) countEl.innerHTML = `❤️ ${count} ${delCount>0?`<span class="delete-count">· 🗑️ ${delCount}</span>`:''}`;
  if(iconEl) iconEl.textContent = voted ? '💛' : '🤍';

  if(voted && !badgeEl){
    const b = document.createElement('div');
    b.className='voted-badge'; b.textContent='✓';
    card.appendChild(b);
  } else if(!voted && badgeEl) badgeEl.remove();

  if(deleted && !delBadgeEl){
    const b = document.createElement('div');
    b.className='delete-badge'; b.textContent='🗑️';
    card.appendChild(b);
  } else if(!deleted && delBadgeEl) delBadgeEl.remove();
}

// ═══ FILTRE ══════════════════════════════════════
window.setFilter = (filter, btn) => {
  currentFilter = filter;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderGrid();
};

// ═══ LIGHTBOX ════════════════════════════════════
function openLightbox(photoId){
  const photo = allPhotos.find(p=>p.id===photoId);
  if(!photo) return;
  lightboxPhotoId = photoId;
  $('lb-img').src = photo.url;
  updateLightboxBtn(photoId);
  updateLightboxDeleteBtn(photoId);
  $('lightbox').classList.add('open');
}

function updateLightboxBtn(photoId){
  if(lightboxPhotoId !== photoId) return;
  const voted = myVotes.has(photoId);
  const count = votes[photoId] || 0;
  const btn = $('lb-vote-btn');
  btn.textContent = voted ? '💔 Retirer mon vote' : '❤️ Voter pour cette photo';
  btn.className = `lb-vote-btn ${voted?'unvote':'vote'}`;
  $('lb-count').textContent = `${count} vote${count>1?'s':''}`;
}

function updateLightboxDeleteBtn(photoId){
  if(lightboxPhotoId !== photoId) return;
  const deleted = myDeletes.has(photoId);
  const count = deleteCounts[photoId] || 0;
  const btn = $('lb-delete-btn');
  btn.textContent = deleted ? '↩️ Annuler suppression' : '🗑️ À supprimer';
  btn.className = `lb-delete-btn ${deleted?'untag':'tag'}`;
  $('lb-delete-count').textContent = count > 0 ? `${count} personne${count>1?'s':''} veut supprimer cette photo` : '';
}

window.toggleVoteLightbox = () => {
  if(lightboxPhotoId) toggleVote(lightboxPhotoId);
};

window.closeLightbox = () => {
  $('lightbox').classList.remove('open');
  lightboxPhotoId = null;
  $('lb-img').src = '';
};

// Ferme lightbox en cliquant dehors
$('lightbox').addEventListener('click', e => {
  if(e.target === $('lightbox')) closeLightbox();
});

// ═══ RÉSULTATS ═══════════════════════════════════
window.showResults = (tab = 'top') => {
  const isDelete = tab === 'delete';

  if(isDelete){
    // Photos les plus taguées à supprimer
    const sorted = [...allPhotos]
      .map(p => ({...p, count: deleteCounts[p.id]||0}))
      .filter(p => p.count > 0)
      .sort((a,b) => b.count - a.count);

    $('results-subtitle').textContent =
      `${sorted.length} photos taguées à supprimer`;

    $('results-grid').innerHTML = sorted.map((p, i) => `
      <div class="result-card" style="border-color:#e94560;">
        <img src="${p.thumb}" alt="${p.name}" loading="lazy" onerror="this.src='${p.url}'"/>
        <div class="rank-badge" style="background:#e94560;">#${i+1}</div>
        <div class="count-badge">🗑️ ${p.count}</div>
      </div>`).join('');

    document.querySelector('#screen-results h2').textContent = '🗑️ Photos à supprimer';

  } else {
    // Top 100
    const sorted = [...allPhotos]
      .map(p => ({...p, count: votes[p.id]||0}))
      .filter(p => p.count > 0)
      .sort((a,b) => b.count - a.count)
      .slice(0, TOP_N);

    $('results-subtitle').textContent =
      `${sorted.length} photos sélectionnées sur ${allPhotos.length}`;

    $('results-grid').innerHTML = sorted.map((p, i) => `
      <div class="result-card">
        <img src="${p.thumb}" alt="${p.name}" loading="lazy" onerror="this.src='${p.url}'"/>
        <div class="rank-badge">#${i+1}</div>
        <div class="count-badge">❤️ ${p.count}</div>
      </div>`).join('');

    document.querySelector('#screen-results h2').textContent = '🏆 Top 100 des photos';
  }

  showScreen('screen-results');
};

window.showVote = () => showScreen('screen-vote');

// ═══ INIT ════════════════════════════════════════
async function init(){
  const saved = loadVoter();
  if(saved?.voterId && saved?.voterName){
    voterName = saved.voterName;
    voterId = saved.voterId;
    await loadEverything();
  } else {
    showScreen('screen-login');
  }
}

init();
</script>
